<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include "partials/seo_head.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-screen">
  <div class="auth-art">
    <a href="{{ url_for('main.home') }}" class="brand auth-brand">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M14 30 L50 30 L45 56 Q44 60 40 60 L24 60 Q20 60 19 56 Z" fill="#F4B740"/>
        <path d="M12 30 C12 18 20 10 32 10 C44 10 52 18 52 30 C52 34 48 36 44 33 C40 30 38 24 32 24 C26 24 24 30 20 33 C16 36 12 34 12 30 Z" fill="#D6336C"/>
        <circle cx="32" cy="14" r="4.5" fill="#9C1F52"/>
      </svg>
      Doce Cupcake
    </a>
    <div class="auth-art-copy">
      <h1>Seu primeiro<br>docinho está aqui.</h1>
      <p>Crie sua conta gratuita e ganhe acesso a promoções exclusivas por e-mail.</p>
    </div>
    <svg class="auth-cupcake" viewBox="0 0 300 320" fill="none">
      <path d="M70 150 L230 150 L212 290 Q209 306 193 306 L107 306 Q91 306 88 290 Z" fill="#FBEBD3"/>
      <path d="M60 150 C40 110 60 70 100 55 C120 47 130 30 150 30 C170 30 180 47 200 55 C240 70 260 110 240 150 C230 168 210 172 195 156 C182 142 170 118 150 118 C130 118 118 142 105 156 C90 172 70 168 60 150 Z" fill="#fff" opacity="0.9"/>
      <circle cx="150" cy="42" r="13" fill="#fff" opacity="0.9"/>
    </svg>
  </div>

  <div class="auth-form-wrap">
    <form id="registerForm" class="auth-form" novalidate>
      <h2>Criar conta</h2>
      <p class="auth-subtitle">Já tem conta? <a href="{{ url_for('main.login_page') }}">Entrar</a></p>

      <label for="name">Nome completo</label>
      <input type="text" id="name" name="name" placeholder="Seu nome" required autocomplete="name">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" required autocomplete="email">

      <label for="phone">Telefone (com DDD)</label>
      <input type="tel" id="phone" name="phone" placeholder="11987654321" required autocomplete="tel" maxlength="11">

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, com letras e números" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="Pelo menos 8 caracteres, com letras e números" autocomplete="new-password">
      <span class="field-hint">Use pelo menos 8 caracteres, misturando letras e números.</span>

      <div class="auth-address-toggle">
        <label class="auth-checkbox">
          <input type="checkbox" id="addAddressNow">
          Já quero cadastrar meu endereço de entrega
        </label>
      </div>

      <div id="addressFields" class="auth-address-fields" hidden>
        <label for="zipCode">CEP</label>
        <input type="text" id="zipCode" placeholder="00000000" maxlength="8">
        <span class="cep-feedback" id="cepFeedback"></span>

        <label for="street">Rua</label>
        <input type="text" id="street" placeholder="Preenchido automaticamente pelo CEP">

        <div class="payment-row">
          <div>
            <label for="number">Número</label>
            <input type="text" id="number" placeholder="123">
          </div>
          <div>
            <label for="complement">Complemento</label>
            <input type="text" id="complement" placeholder="Apto, bloco (opcional)">
          </div>
        </div>

        <label for="neighborhood">Bairro</label>
        <input type="text" id="neighborhood" placeholder="Preenchido automaticamente pelo CEP">

        <div class="payment-row">
          <div>
            <label for="city">Cidade</label>
            <input type="text" id="city" placeholder="Preenchido automaticamente pelo CEP">
          </div>
          <div>
            <label for="state">UF</label>
            <input type="text" id="state" placeholder="SP" maxlength="2">
          </div>
        </div>
      </div>

      <label class="auth-checkbox" style="margin-top:18px;">
        <input type="checkbox" id="acceptPrivacy" required>
        Li e aceito a <a href="{{ url_for('main.privacidade_page') }}" target="_blank">Política de Privacidade</a>
      </label>

      <p class="auth-error" id="authError"></p>

      <button type="submit" class="btn btn-cherry auth-submit">Criar conta</button>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/security.js') }}"></script>
<script src="{{ url_for('static', filename='js/cep.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
